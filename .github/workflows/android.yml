name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"

jobs:
  build-android:
    name: Build Candy.flood APK
    runs-on: ubuntu-latest

    steps:
      # 1. Получаем файлы проекта
      - name: Checkout
        uses: actions/checkout@v7

      # 2. Python
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      # 3. Java 17
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      # 4. Системные зависимости
      - name: Install Linux dependencies
        run: |
          sudo apt update
          sudo apt -y install \
            automake \
            libltdl-dev \
            libtool \
            pkg-config \
            zlib1g-dev \
            libffi-dev \
            libssl-dev \
            cmake

      # 5. Устанавливаем Buildozer
         - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer setuptools cython==0.29.34

      # 6. Проверяем проект
      - name: Check project
        run: |
          echo "=== Project files ==="
          ls -la

          echo "=== Checking main.py ==="
          test -f main.py

          echo "=== Checking buildozer.spec ==="
          test -f buildozer.spec

          echo "=== Buildozer version ==="
          buildozer --version

      # 7. Разрешаем Android SDK licenses
      - name: Enable Android SDK license
        run: |
          if grep -q "^# *android.accept_sdk_license" buildozer.spec; then
            sed -i \
              's/^# *android.accept_sdk_license.*/android.accept_sdk_license = True/' \
              buildozer.spec
          elif ! grep -q "^android.accept_sdk_license" buildozer.spec; then
            printf '\nandroid.accept_sdk_license = True\n' >> buildozer.spec
          fi

      # 8. Предварительно скачиваем Android SDK / NDK / p4a
      - name: Prepare Android SDK, NDK and p4a
        run: |
          buildozer android p4a -- --help

      # 9. Собираем APK
      - name: Build Android APK
        env:
          BUILDOZER_ALLOW_ORG_TEST_DOMAIN: "1"
        run: |
          touch main.py
          buildozer -v android debug

      # 10. Загружаем APK в Artifacts
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Candy-flood-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
