name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    name: Build Candy.flood APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            automake

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer
          python -m pip install "cython==0.29.34"

      - name: Check project
        run: |
          echo "Checking project files..."
          test -f main.py
          test -f buildozer.spec
          echo "main.py found"
          echo "buildozer.spec found"
          buildozer --version

      - name: Check Android license setting
        run: |
          grep -q "^android.accept_sdk_license = True" buildozer.spec

      - name: Build Android APK
        env:
          BUILDOZER_ALLOW_ORG_TEST_DOMAIN: "1"
          PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"
        run: |
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Candy-flood-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
